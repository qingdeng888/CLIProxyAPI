services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        # 面板来源镜像（qingdeng888 前端仓库 CI 产物）；本地构建前端后可覆盖：
        #   docker build --build-arg WEB_IMAGE=cli-proxy-web:local
        WEB_IMAGE: ${WEB_IMAGE:-ghcr.io/qingdeng888/cli-proxy-web:latest}
    container_name: cli-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
      # 管理面板（自定义前端单文件 SPA）已随镜像内置于 /CLIProxyAPI/static，
      # 无需额外挂载。如需临时覆盖面板，自行追加 -v ./static:/CLIProxyAPI/static
    ports:
      - "${PORT_MAP:-13001}:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped
