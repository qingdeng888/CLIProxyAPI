name: docker-build-push

# 构建并推送后端 Docker 镜像到 GitHub Container Registry (GHCR)。
#
# 触发：向 main 分支推送时（也可手动触发 / 打 tag 时）
# 产物：ghcr.io/<owner>/cli-proxy-api:latest （带 commit sha 标签）
#
# 说明：GHCR 使用仓库自带的 GITHUB_TOKEN，无需配置额外 Secrets。
# 首次推送后需在仓库 Settings → Packages 里把镜像设为 public
# （或在 Packages 页面点击 "Make public"），否则 compose pull 会要求登录。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  APP_NAME: CLIProxyAPI
  IMAGE_NAME: cli-proxy-api

jobs:
  docker_build_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Build Metadata
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          # 镜像全名：ghcr.io/<owner>/cli-proxy-api （owner 小写）
          echo "IMAGE_URI=ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ${{ env.IMAGE_URI }}:latest
            ${{ env.IMAGE_URI }}:${{ env.COMMIT }}
            ${{ env.IMAGE_URI }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max