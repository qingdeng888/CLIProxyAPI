# 前后端一起 Docker 部署（全栈 compose）— 预构建镜像版（默认）
#
# 拓扑：
#   web (nginx 托管前端单文件 + /v0/ 反代) ──► backend (CLIProxyAPI 管理 API)
#
# ⚠️ 本文件使用 GitHub Actions 预构建好的镜像（GHCR），无需本地编译，启动最快。
#    想用本地源码构建？请改用：
#      docker compose -f docker-compose.full.local.yml up -d
#
# 用法（在后端仓库根目录执行）：
#   docker compose -f docker-compose.full.yml up -d
#   访问 http://<host>:40010/   （外网开放端口，默认 40010）
#
# 常用变量：
#   WEB_PORT           宿主机对外开放端口                   (默认 40010，浏览器访问这个)
#   BACKEND_PORT       后端容器内部监听端口                 (默认 40010，须与 config.yaml 的 port 一致)
#   WEB_IMAGE          前端镜像（默认 GHCR 预构建）
#   CLI_PROXY_IMAGE    后端镜像（默认 GHCR 预构建）
#   CLI_PROXY_CONFIG_PATH  后端 config.yaml 路径            (默认 ./config.yaml)
#
# 预构建镜像说明：
#   GitHub Actions 在推 main 分支时自动构建推送：
#     ghcr.io/<你的GitHub名>/cli-proxy-web:latest     （前端仓库 workflow）
#     ghcr.io/<你的GitHub名>/cli-proxy-api:latest     （本仓库 workflow）
#   首次使用无需额外设置：GHCR 容器镜像默认公开，任何服务器免登录即可拉取。

services:
  # ---------- 前端：nginx 托管单文件 SPA + 反代 /v0/ 到后端 ----------
  web:
    image: ${WEB_IMAGE:-ghcr.io/qingdeng888/cli-proxy-web:latest}
    container_name: cli-proxy-web
    ports:
      - "${WEB_PORT:-40010}:80"
    environment:
      # 渲染 nginx 模板（/etc/nginx/templates/*.template）使用
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT:-40010}
    depends_on:
      - backend
    restart: unless-stopped

  # ---------- 后端：CLIProxyAPI 管理 API ----------
  backend:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/qingdeng888/cli-proxy-api:latest}
    container_name: cli-proxy-api
    environment:
      # 控制面板静态目录（前端单文件可放这里由后端 /management.html 托管）
      MANAGEMENT_STATIC_PATH: /CLIProxyAPI/static
      # 健康检查端口与后端监听端口保持一致
      HEALTHCHECK_PORT: ${BACKEND_PORT:-40010}
    volumes:
      # 挂载你的实际配置文件（不挂载则用镜像内置 config.example.yaml）
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    expose:
      - "${BACKEND_PORT:-40010}"
    restart: unless-stopped

# 只需访问前端页面（40010）即可使用完整系统；
# 若需直连后端（如 curl 管理 API），在 ports 里额外映射 40010。