# 前后端一起 Docker 部署（全栈 compose）
#
# 拓扑：
#   web (nginx 托管前端单文件 + /v0/ 反代) ──► backend (CLIProxyAPI 管理 API)
#
# 前置：两个仓库为同级目录
#   ./CLIProxyAPI                  （本仓库，后端）
#   ../Cli-Proxy-API-Management-Center （前端，与你本地路径一致）
#
# 用法（在本仓库根目录执行）：
#   docker compose -f docker-compose.full.yml up -d --build
#   访问 http://<host>:40010/   （外网开放端口，默认 40010）
#
# 常用变量：
#   WEB_PORT        前端宿主机端口      (默认 40010，外网开放端口)
#   BACKEND_PORT    后端监听端口        (默认 40010，须与 config.yaml 的 port 一致)
#   CLI_PROXY_CONFIG_PATH  后端 config.yaml 路径 (默认 ../deploy/config.yaml)

services:
  # ---------- 前端：nginx 托管单文件 SPA + 反代 /v0/ 到后端 ----------
  web:
    build:
      context: ../Cli-Proxy-API-Management-Center
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: ${WEB_IMAGE:-cli-proxy-web:local}
    container_name: cli-proxy-web
    ports:
      - "${WEB_PORT:-40010}:80"
    environment:
      # 渲染 nginx 模板（/etc/nginx/templates/*.template）使用
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT:-40010}
    depends_on:
      - backend
    restart: unless-stopped

  # ---------- 后端：CLIProxyAPI 管理 API ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: ${CLI_PROXY_IMAGE:-cli-proxy-api:local}
    container_name: cli-proxy-api
    environment:
      # 控制面板静态目录（前端单文件可放这里由后端 /management.html 托管）
      MANAGEMENT_STATIC_PATH: /CLIProxyAPI/static
      # 健康检查端口与后端监听端口保持一致
      HEALTHCHECK_PORT: ${BACKEND_PORT:-40010}
    volumes:
      # 挂载你的实际配置文件（不挂载则用镜像内置 config.example.yaml）
      - ${CLI_PROXY_CONFIG_PATH:-../deploy/config.yaml}:/CLIProxyAPI/config.yaml
      # config.yaml 内 auth-dir 指向宿主机绝对路径 /root/dsh/api/deploy/auths，
      # 这里把整个 deploy 目录挂到容器内相同路径，保证认证目录解析一致
      - /root/dsh/api/deploy:/root/dsh/api/deploy
      - ${CLI_PROXY_AUTH_PATH:-../deploy/auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-../deploy/logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-../deploy/plugins}:/CLIProxyAPI/plugins
    expose:
      - "${BACKEND_PORT:-40010}"
    restart: unless-stopped

# 只需访问前端页面（40010）即可使用完整系统；
# 若需直连后端（如 curl 管理 API），在 ports 里额外映射 40010。